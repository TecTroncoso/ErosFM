<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eros FM | Radio Sensual</title>
    <!-- Google Fonts para dar un toque elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="radio-container">
        <header>
            <h1 class="logo">Eros<span>FM</span></h1>
            <p class="tagline">Siente el ritmo en tu piel...</p>
        </header>

        <main class="player">
            <!-- Portada / Vinilo -->
            <div class="artwork-container">
                <div class="artwork" id="artwork">
                    <!-- Imagen sugerente y elegante de Unsplash -->
                    <img src="https://images.unsplash.com/photo-1502872364588-894d7d6ddfab?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Sensual Cover Art">
                    <div class="vinyl-hole"></div>
                </div>
            </div>

            <!-- Información de la pista -->
            <div class="track-info">
                <h2 id="track-title">Besos de Medianoche</h2>
                <h3 id="artist-name">Late Night Jazz & R&B</h3>
            </div>

            <!-- Controles del reproductor -->
            <div class="controls">
                <button class="control-btn" id="prev-btn"><i class="fas fa-backward-step"></i></button>
                <button class="play-btn" id="play-btn"><i class="fas fa-play" id="play-icon"></i></button>
                <button class="control-btn" id="next-btn"><i class="fas fa-forward-step"></i></button>
            </div>

            <!-- Control de Volumen -->
            <div class="volume-container">
                <i class="fas fa-volume-low"></i>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
                <i class="fas fa-volume-high"></i>
            </div>
        </main>

        <footer>
            <p>Déjate llevar por la noche.</p>
            <div class="socials">
                <i class="fab fa-instagram"></i>
                <i class="fab fa-twitter"></i>
                <i class="fab fa-spotify"></i>
            </div>
        </footer>
    </div>

    <!-- Reproductor de Audio (Puedes poner aquí la URL real de tu streaming) -->
    <!-- Por ahora tiene un mp3 genérico de prueba -->
    <audio id="audio-player" src="/stream" preload="none"></audio>
    
    <script src="script.js"></script>
</body>
</html>
